<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1E3A8A">
<title>FocusClass</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
:root{--bg:#F4F7FB;--card:#fff;--tx:#0F172A;--mut:#64748B;--pri:#2563EB;--bd:#E2E8F0;--tag:#DBEAFE;--tagx:#1E40AF;--ok:#16A34A;--bad:#DC2626}
@media(prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#111A2E;--tx:#E8EEF9;--mut:#93A1BC;--pri:#3B82F6;--bd:#22304D;--tag:#1E3A8A;--tagx:#DBEAFE}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff}
header b{font-size:18px}header span{flex:1;text-align:right;font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:8px 12px;margin:0}
main{max-width:720px;margin:0 auto;padding:16px}.wrap{max-width:420px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;text-align:center;padding:48px 16px 80px}
.hero h1{margin:14px 0 4px;font-size:30px}.hero p{margin:0;opacity:.85}.pull{margin-top:-52px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
h2,h3{margin:0 0 10px}
input,select{width:100%;padding:12px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:0}
button{padding:11px 16px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin:2px 6px 2px 0}
button.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}button.bad{background:var(--bad)}button.ok{background:var(--ok)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
.code{font-size:36px;letter-spacing:8px;font-weight:800;color:var(--pri)}.mut{color:var(--mut);font-size:14px}.err{color:var(--bad)}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--tag);color:var(--tagx)}
</style></head>
<body><div id="app"></div><script type="module" src="app.js"></script></body></html>
