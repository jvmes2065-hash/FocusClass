<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1E3A8A">
<title>FocusClass</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FocusClass"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
:root{--bg:#F4F7FB;--card:#fff;--tx:#0F172A;--mut:#64748B;--pri:#2563EB;--bd:#E2E8F0;--tag:#DBEAFE;--tagx:#1E40AF;--ok:#16A34A;--bad:#DC2626}
@media(prefers-color-scheme:dark){:root{--bg:#0B1220;--card:#111A2E;--tx:#E8EEF9;--mut:#93A1BC;--pri:#3B82F6;--bd:#22304D;--tag:#1E3A8A;--tagx:#DBEAFE}}
*{box-sizing:border-box}body{margin:0;font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;gap:10px;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff}
header b{font-size:18px}header span{flex:1;text-align:right;font-size:13px;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header button{background:rgba(255,255,255,.18);color:#fff;border:0;padding:8px 12px;margin:0}
main{max-width:720px;margin:0 auto;padding:16px}.wrap{max-width:420px;margin:0 auto;padding:0 16px}
.hero{background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;text-align:center;padding:48px 16px 80px}
.hero h1{margin:14px 0 4px;font-size:30px}.hero p{margin:0;opacity:.85}.pull{margin-top:-52px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px;margin:0 0 14px;box-shadow:0 1px 3px rgba(15,23,42,.06)}
h2,h3{margin:0 0 10px}
input,select{width:100%;padding:12px;margin:4px 0 8px;border:1px solid var(--bd);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit}
input:focus,select:focus{outline:2px solid var(--pri);outline-offset:0}
button{padding:11px 16px;border:0;border-radius:12px;background:var(--pri);color:#fff;font:inherit;font-weight:600;cursor:pointer;margin:2px 6px 2px 0}
button.alt{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}button.bad{background:var(--bad)}button.ok{background:var(--ok)}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--bd)}
.code{font-size:36px;letter-spacing:8px;font-weight:800;color:var(--pri)}.mut{color:var(--mut);font-size:14px}.err{color:var(--bad)}
a.btn{display:inline-block;padding:11px 16px;border-radius:12px;background:var(--pri);color:#fff;font-weight:600;text-decoration:none;margin:2px 6px 8px 0}
.tabs{display:flex;gap:6px;margin:0 0 14px}.tabs button{flex:1;margin:0;background:transparent;color:var(--mut);border:1.5px solid var(--bd)}
.tabs button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.avatar{width:40px;height:40px;flex:none;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.stats div{background:var(--bg);border-radius:12px;padding:10px 4px;text-align:center}
.stats b{display:block;font-size:20px}.stats span{font-size:11px;color:var(--mut)}
.days{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.dchip{display:flex;align-items:center;gap:5px;padding:6px 10px;border:1px solid var(--bd);border-radius:99px;font-size:14px}.dchip input{width:auto;margin:0}
.tag{font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--tag);color:var(--tagx)}
#splash{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;transition:opacity .4s}
#splash.hide{opacity:0;pointer-events:none}#splash svg{animation:pop .7s ease-out both}
#splash h1{margin:16px 0 4px;font-size:32px;letter-spacing:1px}#splash p{margin:0;opacity:.85}
.bar{width:160px;height:4px;border-radius:4px;background:rgba(255,255,255,.25);margin-top:28px;overflow:hidden}
.bar i{display:block;height:100%;width:40%;background:#fff;border-radius:4px;animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{margin-left:-40%}100%{margin-left:100%}}@keyframes pop{0%{transform:scale(.8);opacity:0}100%{transform:scale(1);opacity:1}}
</style></head>
<body><div id="splash"><svg viewBox="0 0 100 100" width="92" height="92" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#fff"/><circle cx="50" cy="50" r="31" fill="none" stroke="#2563EB" stroke-width="5"/><circle cx="50" cy="50" r="19" fill="none" stroke="#93C5FD" stroke-width="5"/><circle cx="50" cy="50" r="7" fill="#2563EB"/></svg><h1>FocusClass</h1><p>Stay focused. Learn better.</p><div class="bar"><i></i></div></div>
<div id="app"></div><script type="module" src="app.js"></script></body></html>
